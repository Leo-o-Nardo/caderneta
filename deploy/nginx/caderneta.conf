# O site da Caderneta no nginx do servidor. Vai em /etc/nginx/sites-available/caderneta, com um
# link em sites-enabled. Antes, troque DOMINIO pelo endereço. O certificado
# é o do Let's Encrypt, tirado com o certbot só para este domínio.
#
# Ele só repassa para os containers, que escutam em 127.0.0.1:
#   /app/  → o WebSocket do Reverb (127.0.0.1:8180)
#   o resto → o nginx interno da Caderneta (127.0.0.1:8100)

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

    # Os áudios enviados ao assistente chegam a alguns MB.
    client_max_body_size 20m;

    access_log /var/log/nginx/caderneta.access.log;
    error_log  /var/log/nginx/caderneta.error.log;

    # O WebSocket: o app conecta em wss://DOMINIO/app/<chave>. O Upgrade troca o HTTP pelo
    # WebSocket, e o tempo longo de leitura segura a conexão aberta entre um ping e outro.
    location /app/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 130s;
    }
}
