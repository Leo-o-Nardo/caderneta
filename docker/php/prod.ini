; Ajustes de produção. O código não muda dentro do container, então o opcache não precisa
; conferir os arquivos a cada pedido (um deploy novo recria o container).
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
