# O nginx de dentro do Docker: serve a pasta public/ e passa o PHP para o container "app".
# Quem recebe a internet e cuida do HTTPS é o nginx do servidor (deploy/nginx/caderneta.conf).
server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Arquivos ocultos (.htaccess e afins) nunca saem.
    location ~ /\. {
        deny all;
    }
}
