# O nginx de dentro do Docker: serve a pasta public/ e passa o PHP para o container "app".
# Quem recebe a internet e cuida do HTTPS é o nginx do servidor (deploy/nginx/caderneta.conf).
server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 20m;
    # Um áudio de 60 s tem uns 250 KB: cabe na memória, sem passar por arquivo temporário.
    client_body_buffer_size 1m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # O DNS do Docker, consultado de novo a cada 10 s: se o container "app" reiniciar e mudar de IP,
    # o nginx acha o novo sozinho (com o nome fixo no fastcgi_pass, ele guardaria o IP de quando subiu).
    resolver 127.0.0.11 valid=10s;
    set $php app:9000;

    location ~ \.php$ {
        fastcgi_pass $php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Arquivos ocultos (.htaccess e afins) nunca saem.
    location ~ /\. {
        deny all;
    }
}
